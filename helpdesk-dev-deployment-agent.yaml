apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: helpdesk-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: GATEWAY_URL
          value: http://ai-gateway.ai-gateway.svc.cluster.local:8080
        - name: MODEL
          value: gpt-6-luna
        envFrom:
        - configMapRef:
            name: agent-config-cdc8gg29bf
        image: ghcr.io/gbaeke/kargo-demo/helpdesk:0.2.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: agent
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
