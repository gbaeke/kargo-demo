apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a2a-only-from-ai-gateway
  namespace: research-test
spec:
  ingress:
  - ports:
    - port: 3000
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-gateway
      podSelector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: ai-gateway
    ports:
    - port: 3001
  podSelector:
    matchLabels:
      app: agent
  policyTypes:
  - Ingress
