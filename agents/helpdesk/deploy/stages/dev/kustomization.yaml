# helpdesk in dev: one replica, at http://localhost:32080.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: helpdesk-dev
resources:
  - ../../base
configMapGenerator:
  - name: agent-config
    literals:
      - STAGE=dev
      # The tools: the MCP server's dev stage, as the gateway serves it.
      - MCP_URL=http://ai-gateway.ai-gateway.svc.cluster.local:8080/mcp/dev
      # Another agent: research in its dev stage, over A2A, as the gateway serves it.
      - A2A_RESEARCH_URL=http://ai-gateway.ai-gateway.svc.cluster.local:8080/a2a/research/dev
patches:
  - target: { kind: Service, name: agent }
    patch: |-
      - { op: add, path: /spec/ports/0/nodePort, value: 32080 }
