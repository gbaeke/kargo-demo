# helpdesk in prod: two replicas, at http://localhost:32081.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: helpdesk-prod
resources:
  - ../../base
configMapGenerator:
  - name: agent-config
    literals:
      - STAGE=prod
      # The tools: the MCP server's prod stage, as the gateway serves it.
      - MCP_URL=http://ai-gateway.ai-gateway.svc.cluster.local:8080/mcp/prod
      # Another agent: research in its prod stage, over A2A, as the gateway serves it.
      - A2A_RESEARCH_URL=http://ai-gateway.ai-gateway.svc.cluster.local:8080/a2a/research/prod
replicas:
  - name: agent
    count: 2
patches:
  - target: { kind: Service, name: agent }
    patch: |-
      - { op: add, path: /spec/ports/0/nodePort, value: 32081 }
