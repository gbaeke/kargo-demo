[package]
name = "research"
version = "0.4.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
# Plain http only: the gateway is inside the cluster, so no TLS stack is needed.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
