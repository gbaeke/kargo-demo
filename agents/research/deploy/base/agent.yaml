apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          # No tag here: Kargo sets it at promotion time (kustomize-set-image).
          image: ghcr.io/gbaeke/kargo-demo/research
          envFrom:
            - configMapRef: { name: agent-config }
          env:
            # The AI gateway holds the provider key; the agent has none.
            - { name: GATEWAY_URL, value: "http://ai-gateway.ai-gateway.svc.cluster.local:8080" }
            - { name: MODEL, value: gpt-6-luna }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  type: NodePort
  selector: { app: agent }
  ports:
    # nodePort is set per stage (../stages/*/kustomization.yaml).
    - { name: http, port: 3000, targetPort: http }
