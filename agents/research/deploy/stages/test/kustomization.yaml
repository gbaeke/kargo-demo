# research in test: one replica, at http://localhost:32083.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: research-test
resources:
  - ../../base
configMapGenerator:
  - name: agent-config
    literals:
      - STAGE=test
patches:
  - target: { kind: Service, name: agent }
    patch: |-
      - { op: add, path: /spec/ports/0/nodePort, value: 32083 }
