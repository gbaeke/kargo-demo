# research in dev: one replica, at http://localhost:32082.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: research-dev
resources:
  - ../../base
configMapGenerator:
  - name: agent-config
    literals:
      - STAGE=dev
patches:
  - target: { kind: Service, name: agent }
    patch: |-
      - { op: add, path: /spec/ports/0/nodePort, value: 32082 }
