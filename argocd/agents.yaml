# One Argo CD Application per app (an agent, or the MCP server) and stage,
# generated from the list below: a new app or a new stage is one more line.
# Each Application is named <app>-<stage>, deploys to the namespace of that
# name and tracks the branch Kargo renders into (stage/<app>/<stage>), which
# appears with the first promotion. No automated sync: Kargo's argocd-update
# step syncs, and the annotation is what allows that one Stage to do so.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agents
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { app: helpdesk, stage: dev }
          - { app: helpdesk, stage: prod }
          - { app: research, stage: dev }
          - { app: research, stage: test }
          - { app: research, stage: prod }
          - { app: mcp-server, stage: dev }
          - { app: mcp-server, stage: prod }
  template:
    metadata:
      name: "{{ .app }}-{{ .stage }}"
      annotations:
        kargo.akuity.io/authorized-stage: "{{ .app }}:{{ .stage }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/gbaeke/kargo-demo
        targetRevision: "stage/{{ .app }}/{{ .stage }}"
        path: .
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .app }}-{{ .stage }}"
      syncPolicy:
        syncOptions: [CreateNamespace=true]
