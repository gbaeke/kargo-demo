# One Application per stage. Each tracks the branch Kargo renders that stage's
# manifests into (stage/dev, stage/prod); the branch appears with the first
# promotion. No automated sync: Kargo's argocd-update step syncs, and the
# annotation is what allows that Stage to do so.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: agent:dev
spec:
  project: default
  source:
    repoURL: https://github.com/gbaeke/kargo-demo
    targetRevision: stage/dev
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-dev
  syncPolicy:
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-prod
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: agent:prod
spec:
  project: default
  source:
    repoURL: https://github.com/gbaeke/kargo-demo
    targetRevision: stage/prod
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-prod
  syncPolicy:
    syncOptions: [CreateNamespace=true]
