# A release is a git tag of the form <agent>/v<version>: helpdesk/v0.2.0
# builds agents/helpdesk and pushes ghcr.io/<owner>/<repo>/helpdesk:0.2.0.
# That agent's Kargo Warehouse sees the new tag and takes it from there; the
# other agents are not touched.
name: release
on:
  push:
    tags: ["*/v*.*.*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          agent="${GITHUB_REF_NAME%%/*}"
          version="${GITHUB_REF_NAME##*/v}"
          [ -d "agents/$agent" ] || { echo "no agent named $agent" >&2; exit 1; }
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ steps.tag.outputs.agent }}:${{ steps.tag.outputs.version }}
          build-args: |
            AGENT=${{ steps.tag.outputs.agent }}
            VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.agent }}
          cache-to: type=gha,mode=max,scope=${{ steps.tag.outputs.agent }}
