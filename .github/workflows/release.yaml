# A release is a git tag of the form <app>/v<version>, where the app is an
# agent or mcp-server: helpdesk/v0.2.0 builds the crate helpdesk and pushes
# ghcr.io/<owner>/<repo>/helpdesk:0.2.0. That app's Kargo Warehouse sees the
# new tag and takes it from there; the others are not touched.
name: release
on:
  push:
    tags: ["*/v*.*.*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          app="${GITHUB_REF_NAME%%/*}"
          version="${GITHUB_REF_NAME##*/v}"
          [ -d "agents/$app" ] || [ "$app" = mcp-server ] || { echo "nothing to build for $app" >&2; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ steps.tag.outputs.app }}:${{ steps.tag.outputs.version }}
          build-args: |
            APP=${{ steps.tag.outputs.app }}
            VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.app }}
          cache-to: type=gha,mode=max,scope=${{ steps.tag.outputs.app }}
