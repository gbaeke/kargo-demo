# prod: two replicas, at http://localhost:32081.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-prod
resources:
  - ../../base
configMapGenerator:
  - name: agent-config
    literals:
      - STAGE=prod
replicas:
  - name: agent
    count: 2
patches:
  - target: { kind: Service, name: agent }
    patch: |-
      - { op: add, path: /spec/ports/0/nodePort, value: 32081 }
